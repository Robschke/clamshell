<!--
  Purpose: Source artwork for the TV Stream Mac app icon (Dock, Applications, Spotlight).
  Depends on: nothing.
  Used by: macos/build-app.sh (rendered to PNG sizes and packed into AppIcon.icns).
  Notes: 1024 canvas with the macOS icon grid (824 px tile, 100 px margin). Abstract motif: a
    glowing screen whose light spills downward, a play shape cut from the glow, and the small
    pointer dot the phone remote moves on the TV.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2340"/>
      <stop offset="1" stop-color="#090b14"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa7ff"/>
      <stop offset="0.55" stop-color="#5a62f0"/>
      <stop offset="1" stop-color="#b061e8"/>
    </linearGradient>
    <radialGradient id="spill" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6f7cff" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#6f7cff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#6f7cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tileClip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#tile)"/>
    <!-- light from the screen falling onto the room below -->
    <ellipse cx="512" cy="600" rx="440" ry="330" fill="url(#spill)"/>
    <!-- glow behind the screen -->
    <rect x="232" y="268" width="560" height="340" rx="64" fill="#6a72ff" opacity="0.65" filter="url(#glow)"/>
  </g>

  <!-- screen -->
  <rect x="232" y="268" width="560" height="340" rx="64" fill="url(#screen)"/>
  <rect x="232" y="268" width="560" height="340" rx="64" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6"/>
  <!-- soft reflection across the top of the screen -->
  <path d="M296 268 h432 a64 64 0 0 1 64 64 v18 C640 300 420 300 232 360 v-28 a64 64 0 0 1 64 -64 z" fill="#ffffff" opacity="0.16"/>
  <!-- play shape -->
  <path d="M470 372 L584 438 L470 504 Z" fill="#ffffff" opacity="0.95" stroke="#ffffff" stroke-width="18" stroke-linejoin="round"/>

  <!-- stand -->
  <rect x="452" y="636" width="120" height="16" rx="8" fill="#ffffff" opacity="0.28"/>

  <!-- the remote's pointer dot -->
  <circle cx="676" cy="744" r="34" fill="#c9d3ff" opacity="0.9"/>
  <circle cx="676" cy="744" r="34" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="5"/>
</svg>
